name: Render WireWave (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render WireWave (ProRes)
        run: npx remotion render src/index.tsx WireWave output/WireWave-prores.mov --codec prores --prores-profile hq

      - name: Render WireWaveEmber (ProRes)
        run: npx remotion render src/index.tsx WireWaveEmber output/WireWaveEmber-prores.mov --codec prores --prores-profile hq

      - name: Render WireWaveAbyss (ProRes)
        run: npx remotion render src/index.tsx WireWaveAbyss output/WireWaveAbyss-prores.mov --codec prores --prores-profile hq

      - name: Render WireWaveMint (ProRes)
        run: npx remotion render src/index.tsx WireWaveMint output/WireWaveMint-prores.mov --codec prores --prores-profile hq

      - name: Render WireWaveRoyal (ProRes)
        run: npx remotion render src/index.tsx WireWaveRoyal output/WireWaveRoyal-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode WireWave to MP4
        run: ffmpeg -y -i output/WireWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/WireWave.mp4

      - name: Encode WireWaveEmber to MP4
        run: ffmpeg -y -i output/WireWaveEmber-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/WireWaveEmber.mp4

      - name: Encode WireWaveAbyss to MP4
        run: ffmpeg -y -i output/WireWaveAbyss-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/WireWaveAbyss.mp4

      - name: Encode WireWaveMint to MP4
        run: ffmpeg -y -i output/WireWaveMint-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/WireWaveMint.mp4

      - name: Encode WireWaveRoyal to MP4
        run: ffmpeg -y -i output/WireWaveRoyal-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/WireWaveRoyal.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload WireWave
        uses: actions/upload-artifact@v4
        with:
          name: WireWave-4K
          path: output/WireWave.mp4

      - name: Upload WireWaveEmber
        uses: actions/upload-artifact@v4
        with:
          name: WireWaveEmber-4K
          path: output/WireWaveEmber.mp4

      - name: Upload WireWaveAbyss
        uses: actions/upload-artifact@v4
        with:
          name: WireWaveAbyss-4K
          path: output/WireWaveAbyss.mp4

      - name: Upload WireWaveMint
        uses: actions/upload-artifact@v4
        with:
          name: WireWaveMint-4K
          path: output/WireWaveMint.mp4

      - name: Upload WireWaveRoyal
        uses: actions/upload-artifact@v4
        with:
          name: WireWaveRoyal-4K
          path: output/WireWaveRoyal.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: WireWave-ProRes
          path: |
            output/WireWave-prores.mov
            output/WireWaveEmber-prores.mov
            output/WireWaveAbyss-prores.mov
            output/WireWaveMint-prores.mov
            output/WireWaveRoyal-prores.mov

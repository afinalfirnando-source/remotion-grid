name: Render SilkGradient (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render SilkGradient (ProRes)
        run: npx remotion render src/index.tsx SilkGradient output/SilkGradient-prores.mov --codec prores --prores-profile hq

      - name: Render SilkGradientSunset (ProRes)
        run: npx remotion render src/index.tsx SilkGradientSunset output/SilkGradientSunset-prores.mov --codec prores --prores-profile hq

      - name: Render SilkGradientLagoon (ProRes)
        run: npx remotion render src/index.tsx SilkGradientLagoon output/SilkGradientLagoon-prores.mov --codec prores --prores-profile hq

      - name: Render SilkGradientRose (ProRes)
        run: npx remotion render src/index.tsx SilkGradientRose output/SilkGradientRose-prores.mov --codec prores --prores-profile hq

      - name: Render SilkGradientMidnight (ProRes)
        run: npx remotion render src/index.tsx SilkGradientMidnight output/SilkGradientMidnight-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode SilkGradient to MP4
        run: ffmpeg -y -i output/SilkGradient-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SilkGradient.mp4

      - name: Encode SilkGradientSunset to MP4
        run: ffmpeg -y -i output/SilkGradientSunset-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SilkGradientSunset.mp4

      - name: Encode SilkGradientLagoon to MP4
        run: ffmpeg -y -i output/SilkGradientLagoon-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SilkGradientLagoon.mp4

      - name: Encode SilkGradientRose to MP4
        run: ffmpeg -y -i output/SilkGradientRose-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SilkGradientRose.mp4

      - name: Encode SilkGradientMidnight to MP4
        run: ffmpeg -y -i output/SilkGradientMidnight-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SilkGradientMidnight.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload SilkGradient
        uses: actions/upload-artifact@v4
        with:
          name: SilkGradient-4K
          path: output/SilkGradient.mp4

      - name: Upload SilkGradientSunset
        uses: actions/upload-artifact@v4
        with:
          name: SilkGradientSunset-4K
          path: output/SilkGradientSunset.mp4

      - name: Upload SilkGradientLagoon
        uses: actions/upload-artifact@v4
        with:
          name: SilkGradientLagoon-4K
          path: output/SilkGradientLagoon.mp4

      - name: Upload SilkGradientRose
        uses: actions/upload-artifact@v4
        with:
          name: SilkGradientRose-4K
          path: output/SilkGradientRose.mp4

      - name: Upload SilkGradientMidnight
        uses: actions/upload-artifact@v4
        with:
          name: SilkGradientMidnight-4K
          path: output/SilkGradientMidnight.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: SilkGradient-ProRes
          path: |
            output/SilkGradient-prores.mov
            output/SilkGradientSunset-prores.mov
            output/SilkGradientLagoon-prores.mov
            output/SilkGradientRose-prores.mov
            output/SilkGradientMidnight-prores.mov

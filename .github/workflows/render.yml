name: Render TriMesh (3 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render TriMeshOcean (ProRes)
        run: npx remotion render src/index.tsx TriMeshOcean output/TriMeshOcean-prores.mov --codec prores --prores-profile hq

      - name: Render TriMeshSunset (ProRes)
        run: npx remotion render src/index.tsx TriMeshSunset output/TriMeshSunset-prores.mov --codec prores --prores-profile hq

      - name: Render TriMeshNeon (ProRes)
        run: npx remotion render src/index.tsx TriMeshNeon output/TriMeshNeon-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode TriMeshOcean to MP4
        run: ffmpeg -y -i output/TriMeshOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/TriMeshOcean.mp4

      - name: Encode TriMeshSunset to MP4
        run: ffmpeg -y -i output/TriMeshSunset-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/TriMeshSunset.mp4

      - name: Encode TriMeshNeon to MP4
        run: ffmpeg -y -i output/TriMeshNeon-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/TriMeshNeon.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload TriMeshOcean
        uses: actions/upload-artifact@v4
        with:
          name: TriMeshOcean-4K
          path: output/TriMeshOcean.mp4

      - name: Upload TriMeshSunset
        uses: actions/upload-artifact@v4
        with:
          name: TriMeshSunset-4K
          path: output/TriMeshSunset.mp4

      - name: Upload TriMeshNeon
        uses: actions/upload-artifact@v4
        with:
          name: TriMeshNeon-4K
          path: output/TriMeshNeon.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: TriMesh-ProRes
          path: |
            output/TriMeshOcean-prores.mov
            output/TriMeshSunset-prores.mov
            output/TriMeshNeon-prores.mov

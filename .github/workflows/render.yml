name: Render BlueFire (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render BlueFire (ProRes)
        run: npx remotion render src/index.tsx BlueFire output/BlueFire-prores.mov --codec prores --prores-profile hq

      - name: Render BlueFireCrimson (ProRes)
        run: npx remotion render src/index.tsx BlueFireCrimson output/BlueFireCrimson-prores.mov --codec prores --prores-profile hq

      - name: Render BlueFireToxic (ProRes)
        run: npx remotion render src/index.tsx BlueFireToxic output/BlueFireToxic-prores.mov --codec prores --prores-profile hq

      - name: Render BlueFireViolet (ProRes)
        run: npx remotion render src/index.tsx BlueFireViolet output/BlueFireViolet-prores.mov --codec prores --prores-profile hq

      - name: Render BlueFireSolar (ProRes)
        run: npx remotion render src/index.tsx BlueFireSolar output/BlueFireSolar-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode BlueFire to MP4
        run: ffmpeg -y -i output/BlueFire-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BlueFire.mp4

      - name: Encode BlueFireCrimson to MP4
        run: ffmpeg -y -i output/BlueFireCrimson-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BlueFireCrimson.mp4

      - name: Encode BlueFireToxic to MP4
        run: ffmpeg -y -i output/BlueFireToxic-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BlueFireToxic.mp4

      - name: Encode BlueFireViolet to MP4
        run: ffmpeg -y -i output/BlueFireViolet-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BlueFireViolet.mp4

      - name: Encode BlueFireSolar to MP4
        run: ffmpeg -y -i output/BlueFireSolar-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BlueFireSolar.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload BlueFire
        uses: actions/upload-artifact@v4
        with:
          name: BlueFire-4K
          path: output/BlueFire.mp4

      - name: Upload BlueFireCrimson
        uses: actions/upload-artifact@v4
        with:
          name: BlueFireCrimson-4K
          path: output/BlueFireCrimson.mp4

      - name: Upload BlueFireToxic
        uses: actions/upload-artifact@v4
        with:
          name: BlueFireToxic-4K
          path: output/BlueFireToxic.mp4

      - name: Upload BlueFireViolet
        uses: actions/upload-artifact@v4
        with:
          name: BlueFireViolet-4K
          path: output/BlueFireViolet.mp4

      - name: Upload BlueFireSolar
        uses: actions/upload-artifact@v4
        with:
          name: BlueFireSolar-4K
          path: output/BlueFireSolar.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: BlueFire-ProRes
          path: |
            output/BlueFire-prores.mov
            output/BlueFireCrimson-prores.mov
            output/BlueFireToxic-prores.mov
            output/BlueFireViolet-prores.mov
            output/BlueFireSolar-prores.mov

name: Render RadialHex (3 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render RadialHex (ProRes)
        run: npx remotion render src/index.tsx RadialHex output/RadialHex-prores.mov --codec prores --prores-profile hq

      - name: Render RadialHexRed (ProRes)
        run: npx remotion render src/index.tsx RadialHexRed output/RadialHexRed-prores.mov --codec prores --prores-profile hq

      - name: Render RadialHexGreen (ProRes)
        run: npx remotion render src/index.tsx RadialHexGreen output/RadialHexGreen-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode RadialHex to MP4
        run: ffmpeg -y -i output/RadialHex-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RadialHex.mp4

      - name: Encode RadialHexRed to MP4
        run: ffmpeg -y -i output/RadialHexRed-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RadialHexRed.mp4

      - name: Encode RadialHexGreen to MP4
        run: ffmpeg -y -i output/RadialHexGreen-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RadialHexGreen.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload RadialHex
        uses: actions/upload-artifact@v4
        with:
          name: RadialHex-4K
          path: output/RadialHex.mp4

      - name: Upload RadialHexRed
        uses: actions/upload-artifact@v4
        with:
          name: RadialHexRed-4K
          path: output/RadialHexRed.mp4

      - name: Upload RadialHexGreen
        uses: actions/upload-artifact@v4
        with:
          name: RadialHexGreen-4K
          path: output/RadialHexGreen.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: RadialHex-ProRes
          path: |
            output/RadialHex-prores.mov
            output/RadialHexRed-prores.mov
            output/RadialHexGreen-prores.mov

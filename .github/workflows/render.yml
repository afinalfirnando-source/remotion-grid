name: Render Grid backgrounds

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render GridWave (PNG sequence)
        run: npx remotion render src/index.tsx GridWave output/gridwave-seq --image-format png --codec png

      - name: Encode GridWave to MP4
        run: ffmpeg -y -framerate 30 -i output/gridwave-seq/%06d.png -c:v libx264 -preset slow -b:v 100M -pix_fmt yuv420p output/GridWave.mp4

      - name: Render GridWaveNeon (PNG sequence)
        run: npx remotion render src/index.tsx GridWaveNeon output/gridwaveneon-seq --image-format png --codec png

      - name: Encode GridWaveNeon to MP4
        run: ffmpeg -y -framerate 30 -i output/gridwaveneon-seq/%06d.png -c:v libx264 -preset slow -b:v 100M -pix_fmt yuv420p output/GridWaveNeon.mp4

      - name: Check file sizes
        run: ls -lh output/*.mp4

      - name: Upload GridWave
        uses: actions/upload-artifact@v4
        with:
          name: GridWave-4K
          path: output/GridWave.mp4

      - name: Upload GridWaveNeon
        uses: actions/upload-artifact@v4
        with:
          name: GridWaveNeon-4K
          path: output/GridWaveNeon.mp4

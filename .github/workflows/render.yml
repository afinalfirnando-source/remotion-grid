name: Render BubbleDrift (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render BubbleDrift (ProRes)
        run: npx remotion render src/index.tsx BubbleDrift output/BubbleDrift-prores.mov --codec prores --prores-profile hq

      - name: Render BubbleDriftGold (ProRes)
        run: npx remotion render src/index.tsx BubbleDriftGold output/BubbleDriftGold-prores.mov --codec prores --prores-profile hq

      - name: Render BubbleDriftOcean (ProRes)
        run: npx remotion render src/index.tsx BubbleDriftOcean output/BubbleDriftOcean-prores.mov --codec prores --prores-profile hq

      - name: Render BubbleDriftRose (ProRes)
        run: npx remotion render src/index.tsx BubbleDriftRose output/BubbleDriftRose-prores.mov --codec prores --prores-profile hq

      - name: Render BubbleDriftEmerald (ProRes)
        run: npx remotion render src/index.tsx BubbleDriftEmerald output/BubbleDriftEmerald-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode BubbleDrift to MP4
        run: ffmpeg -y -i output/BubbleDrift-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BubbleDrift.mp4

      - name: Encode BubbleDriftGold to MP4
        run: ffmpeg -y -i output/BubbleDriftGold-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BubbleDriftGold.mp4

      - name: Encode BubbleDriftOcean to MP4
        run: ffmpeg -y -i output/BubbleDriftOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BubbleDriftOcean.mp4

      - name: Encode BubbleDriftRose to MP4
        run: ffmpeg -y -i output/BubbleDriftRose-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BubbleDriftRose.mp4

      - name: Encode BubbleDriftEmerald to MP4
        run: ffmpeg -y -i output/BubbleDriftEmerald-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BubbleDriftEmerald.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload BubbleDrift
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDrift-4K
          path: output/BubbleDrift.mp4

      - name: Upload BubbleDriftGold
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDriftGold-4K
          path: output/BubbleDriftGold.mp4

      - name: Upload BubbleDriftOcean
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDriftOcean-4K
          path: output/BubbleDriftOcean.mp4

      - name: Upload BubbleDriftRose
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDriftRose-4K
          path: output/BubbleDriftRose.mp4

      - name: Upload BubbleDriftEmerald
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDriftEmerald-4K
          path: output/BubbleDriftEmerald.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDrift-ProRes
          path: |
            output/BubbleDrift-prores.mov
            output/BubbleDriftGold-prores.mov
            output/BubbleDriftOcean-prores.mov
            output/BubbleDriftRose-prores.mov
            output/BubbleDriftEmerald-prores.mov

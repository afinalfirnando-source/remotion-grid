name: Render BokehGlow (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render BokehGlow (ProRes)
        run: npx remotion render src/index.tsx BokehGlow output/BokehGlow-prores.mov --codec prores --prores-profile hq

      - name: Render BokehGlowViolet (ProRes)
        run: npx remotion render src/index.tsx BokehGlowViolet output/BokehGlowViolet-prores.mov --codec prores --prores-profile hq

      - name: Render BokehGlowRose (ProRes)
        run: npx remotion render src/index.tsx BokehGlowRose output/BokehGlowRose-prores.mov --codec prores --prores-profile hq

      - name: Render BokehGlowGold (ProRes)
        run: npx remotion render src/index.tsx BokehGlowGold output/BokehGlowGold-prores.mov --codec prores --prores-profile hq

      - name: Render BokehGlowEmerald (ProRes)
        run: npx remotion render src/index.tsx BokehGlowEmerald output/BokehGlowEmerald-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode BokehGlow to MP4
        run: ffmpeg -y -i output/BokehGlow-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BokehGlow.mp4

      - name: Encode BokehGlowViolet to MP4
        run: ffmpeg -y -i output/BokehGlowViolet-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BokehGlowViolet.mp4

      - name: Encode BokehGlowRose to MP4
        run: ffmpeg -y -i output/BokehGlowRose-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BokehGlowRose.mp4

      - name: Encode BokehGlowGold to MP4
        run: ffmpeg -y -i output/BokehGlowGold-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BokehGlowGold.mp4

      - name: Encode BokehGlowEmerald to MP4
        run: ffmpeg -y -i output/BokehGlowEmerald-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BokehGlowEmerald.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload BokehGlow
        uses: actions/upload-artifact@v4
        with:
          name: BokehGlow-4K
          path: output/BokehGlow.mp4

      - name: Upload BokehGlowViolet
        uses: actions/upload-artifact@v4
        with:
          name: BokehGlowViolet-4K
          path: output/BokehGlowViolet.mp4

      - name: Upload BokehGlowRose
        uses: actions/upload-artifact@v4
        with:
          name: BokehGlowRose-4K
          path: output/BokehGlowRose.mp4

      - name: Upload BokehGlowGold
        uses: actions/upload-artifact@v4
        with:
          name: BokehGlowGold-4K
          path: output/BokehGlowGold.mp4

      - name: Upload BokehGlowEmerald
        uses: actions/upload-artifact@v4
        with:
          name: BokehGlowEmerald-4K
          path: output/BokehGlowEmerald.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: BokehGlow-ProRes
          path: |
            output/BokehGlow-prores.mov
            output/BokehGlowViolet-prores.mov
            output/BokehGlowRose-prores.mov
            output/BokehGlowGold-prores.mov
            output/BokehGlowEmerald-prores.mov

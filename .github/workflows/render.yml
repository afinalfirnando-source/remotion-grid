name: Render FrostCrystal (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render FrostCrystal (ProRes)
        run: npx remotion render src/index.tsx FrostCrystal output/FrostCrystal-prores.mov --codec prores --prores-profile hq

      - name: Render FrostCrystalAurora (ProRes)
        run: npx remotion render src/index.tsx FrostCrystalAurora output/FrostCrystalAurora-prores.mov --codec prores --prores-profile hq

      - name: Render FrostCrystalEmber (ProRes)
        run: npx remotion render src/index.tsx FrostCrystalEmber output/FrostCrystalEmber-prores.mov --codec prores --prores-profile hq

      - name: Render FrostCrystalVoid (ProRes)
        run: npx remotion render src/index.tsx FrostCrystalVoid output/FrostCrystalVoid-prores.mov --codec prores --prores-profile hq

      - name: Render FrostCrystalEmerald (ProRes)
        run: npx remotion render src/index.tsx FrostCrystalEmerald output/FrostCrystalEmerald-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode FrostCrystal to MP4
        run: ffmpeg -y -i output/FrostCrystal-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FrostCrystal.mp4

      - name: Encode FrostCrystalAurora to MP4
        run: ffmpeg -y -i output/FrostCrystalAurora-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FrostCrystalAurora.mp4

      - name: Encode FrostCrystalEmber to MP4
        run: ffmpeg -y -i output/FrostCrystalEmber-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FrostCrystalEmber.mp4

      - name: Encode FrostCrystalVoid to MP4
        run: ffmpeg -y -i output/FrostCrystalVoid-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FrostCrystalVoid.mp4

      - name: Encode FrostCrystalEmerald to MP4
        run: ffmpeg -y -i output/FrostCrystalEmerald-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FrostCrystalEmerald.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload FrostCrystal
        uses: actions/upload-artifact@v4
        with:
          name: FrostCrystal-4K
          path: output/FrostCrystal.mp4

      - name: Upload FrostCrystalAurora
        uses: actions/upload-artifact@v4
        with:
          name: FrostCrystalAurora-4K
          path: output/FrostCrystalAurora.mp4

      - name: Upload FrostCrystalEmber
        uses: actions/upload-artifact@v4
        with:
          name: FrostCrystalEmber-4K
          path: output/FrostCrystalEmber.mp4

      - name: Upload FrostCrystalVoid
        uses: actions/upload-artifact@v4
        with:
          name: FrostCrystalVoid-4K
          path: output/FrostCrystalVoid.mp4

      - name: Upload FrostCrystalEmerald
        uses: actions/upload-artifact@v4
        with:
          name: FrostCrystalEmerald-4K
          path: output/FrostCrystalEmerald.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: FrostCrystal-ProRes
          path: |
            output/FrostCrystal-prores.mov
            output/FrostCrystalAurora-prores.mov
            output/FrostCrystalEmber-prores.mov
            output/FrostCrystalVoid-prores.mov
            output/FrostCrystalEmerald-prores.mov

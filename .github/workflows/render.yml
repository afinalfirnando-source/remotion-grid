name: Render SmokeWisps (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render SmokeWisps (ProRes)
        run: npx remotion render src/index.tsx SmokeWisps output/SmokeWisps-prores.mov --codec prores --prores-profile hq

      - name: Render SmokeWispsEmber (ProRes)
        run: npx remotion render src/index.tsx SmokeWispsEmber output/SmokeWispsEmber-prores.mov --codec prores --prores-profile hq

      - name: Render SmokeWispsAbyss (ProRes)
        run: npx remotion render src/index.tsx SmokeWispsAbyss output/SmokeWispsAbyss-prores.mov --codec prores --prores-profile hq

      - name: Render SmokeWispsMint (ProRes)
        run: npx remotion render src/index.tsx SmokeWispsMint output/SmokeWispsMint-prores.mov --codec prores --prores-profile hq

      - name: Render SmokeWispsRoyal (ProRes)
        run: npx remotion render src/index.tsx SmokeWispsRoyal output/SmokeWispsRoyal-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode SmokeWisps to MP4
        run: ffmpeg -y -i output/SmokeWisps-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SmokeWisps.mp4

      - name: Encode SmokeWispsEmber to MP4
        run: ffmpeg -y -i output/SmokeWispsEmber-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SmokeWispsEmber.mp4

      - name: Encode SmokeWispsAbyss to MP4
        run: ffmpeg -y -i output/SmokeWispsAbyss-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SmokeWispsAbyss.mp4

      - name: Encode SmokeWispsMint to MP4
        run: ffmpeg -y -i output/SmokeWispsMint-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SmokeWispsMint.mp4

      - name: Encode SmokeWispsRoyal to MP4
        run: ffmpeg -y -i output/SmokeWispsRoyal-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SmokeWispsRoyal.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload SmokeWisps
        uses: actions/upload-artifact@v4
        with:
          name: SmokeWisps-4K
          path: output/SmokeWisps.mp4

      - name: Upload SmokeWispsEmber
        uses: actions/upload-artifact@v4
        with:
          name: SmokeWispsEmber-4K
          path: output/SmokeWispsEmber.mp4

      - name: Upload SmokeWispsAbyss
        uses: actions/upload-artifact@v4
        with:
          name: SmokeWispsAbyss-4K
          path: output/SmokeWispsAbyss.mp4

      - name: Upload SmokeWispsMint
        uses: actions/upload-artifact@v4
        with:
          name: SmokeWispsMint-4K
          path: output/SmokeWispsMint.mp4

      - name: Upload SmokeWispsRoyal
        uses: actions/upload-artifact@v4
        with:
          name: SmokeWispsRoyal-4K
          path: output/SmokeWispsRoyal.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: SmokeWisps-ProRes
          path: |
            output/SmokeWisps-prores.mov
            output/SmokeWispsEmber-prores.mov
            output/SmokeWispsAbyss-prores.mov
            output/SmokeWispsMint-prores.mov
            output/SmokeWispsRoyal-prores.mov

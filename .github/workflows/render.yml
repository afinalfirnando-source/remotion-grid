name: Render FlowingLines (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render FlowingLines (ProRes)
        run: npx remotion render src/index.tsx FlowingLines output/FlowingLines-prores.mov --codec prores --prores-profile hq

      - name: Render FlowingLinesCyan (ProRes)
        run: npx remotion render src/index.tsx FlowingLinesCyan output/FlowingLinesCyan-prores.mov --codec prores --prores-profile hq

      - name: Render FlowingLinesGold (ProRes)
        run: npx remotion render src/index.tsx FlowingLinesGold output/FlowingLinesGold-prores.mov --codec prores --prores-profile hq

      - name: Render FlowingLinesNeon (ProRes)
        run: npx remotion render src/index.tsx FlowingLinesNeon output/FlowingLinesNeon-prores.mov --codec prores --prores-profile hq

      - name: Render FlowingLinesMint (ProRes)
        run: npx remotion render src/index.tsx FlowingLinesMint output/FlowingLinesMint-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode FlowingLines to MP4
        run: ffmpeg -y -i output/FlowingLines-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FlowingLines.mp4

      - name: Encode FlowingLinesCyan to MP4
        run: ffmpeg -y -i output/FlowingLinesCyan-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FlowingLinesCyan.mp4

      - name: Encode FlowingLinesGold to MP4
        run: ffmpeg -y -i output/FlowingLinesGold-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FlowingLinesGold.mp4

      - name: Encode FlowingLinesNeon to MP4
        run: ffmpeg -y -i output/FlowingLinesNeon-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FlowingLinesNeon.mp4

      - name: Encode FlowingLinesMint to MP4
        run: ffmpeg -y -i output/FlowingLinesMint-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/FlowingLinesMint.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload FlowingLines
        uses: actions/upload-artifact@v4
        with:
          name: FlowingLines-4K
          path: output/FlowingLines.mp4

      - name: Upload FlowingLinesCyan
        uses: actions/upload-artifact@v4
        with:
          name: FlowingLinesCyan-4K
          path: output/FlowingLinesCyan.mp4

      - name: Upload FlowingLinesGold
        uses: actions/upload-artifact@v4
        with:
          name: FlowingLinesGold-4K
          path: output/FlowingLinesGold.mp4

      - name: Upload FlowingLinesNeon
        uses: actions/upload-artifact@v4
        with:
          name: FlowingLinesNeon-4K
          path: output/FlowingLinesNeon.mp4

      - name: Upload FlowingLinesMint
        uses: actions/upload-artifact@v4
        with:
          name: FlowingLinesMint-4K
          path: output/FlowingLinesMint.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: FlowingLines-ProRes
          path: |
            output/FlowingLines-prores.mov
            output/FlowingLinesCyan-prores.mov
            output/FlowingLinesGold-prores.mov
            output/FlowingLinesNeon-prores.mov
            output/FlowingLinesMint-prores.mov

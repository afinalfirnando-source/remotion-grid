name: Render LavaVeins (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render LavaVeins (ProRes)
        run: npx remotion render src/index.tsx LavaVeins output/LavaVeins-prores.mov --codec prores --prores-profile hq

      - name: Render LavaVeinsIce (ProRes)
        run: npx remotion render src/index.tsx LavaVeinsIce output/LavaVeinsIce-prores.mov --codec prores --prores-profile hq

      - name: Render LavaVeinsToxic (ProRes)
        run: npx remotion render src/index.tsx LavaVeinsToxic output/LavaVeinsToxic-prores.mov --codec prores --prores-profile hq

      - name: Render LavaVeinsVoid (ProRes)
        run: npx remotion render src/index.tsx LavaVeinsVoid output/LavaVeinsVoid-prores.mov --codec prores --prores-profile hq

      - name: Render LavaVeinsSolar (ProRes)
        run: npx remotion render src/index.tsx LavaVeinsSolar output/LavaVeinsSolar-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode LavaVeins to MP4
        run: ffmpeg -y -i output/LavaVeins-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LavaVeins.mp4

      - name: Encode LavaVeinsIce to MP4
        run: ffmpeg -y -i output/LavaVeinsIce-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LavaVeinsIce.mp4

      - name: Encode LavaVeinsToxic to MP4
        run: ffmpeg -y -i output/LavaVeinsToxic-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LavaVeinsToxic.mp4

      - name: Encode LavaVeinsVoid to MP4
        run: ffmpeg -y -i output/LavaVeinsVoid-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LavaVeinsVoid.mp4

      - name: Encode LavaVeinsSolar to MP4
        run: ffmpeg -y -i output/LavaVeinsSolar-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LavaVeinsSolar.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload LavaVeins
        uses: actions/upload-artifact@v4
        with:
          name: LavaVeins-4K
          path: output/LavaVeins.mp4

      - name: Upload LavaVeinsIce
        uses: actions/upload-artifact@v4
        with:
          name: LavaVeinsIce-4K
          path: output/LavaVeinsIce.mp4

      - name: Upload LavaVeinsToxic
        uses: actions/upload-artifact@v4
        with:
          name: LavaVeinsToxic-4K
          path: output/LavaVeinsToxic.mp4

      - name: Upload LavaVeinsVoid
        uses: actions/upload-artifact@v4
        with:
          name: LavaVeinsVoid-4K
          path: output/LavaVeinsVoid.mp4

      - name: Upload LavaVeinsSolar
        uses: actions/upload-artifact@v4
        with:
          name: LavaVeinsSolar-4K
          path: output/LavaVeinsSolar.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: LavaVeins-ProRes
          path: |
            output/LavaVeins-prores.mov
            output/LavaVeinsIce-prores.mov
            output/LavaVeinsToxic-prores.mov
            output/LavaVeinsVoid-prores.mov
            output/LavaVeinsSolar-prores.mov

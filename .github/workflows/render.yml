name: Render UnderwaterCaustics (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render UnderwaterCaustics (ProRes)
        run: npx remotion render src/index.tsx UnderwaterCaustics output/UnderwaterCaustics-prores.mov --codec prores --prores-profile hq

      - name: Render UnderwaterCausticsDeepOcean (ProRes)
        run: npx remotion render src/index.tsx UnderwaterCausticsDeepOcean output/UnderwaterCausticsDeepOcean-prores.mov --codec prores --prores-profile hq

      - name: Render UnderwaterCausticsCoral (ProRes)
        run: npx remotion render src/index.tsx UnderwaterCausticsCoral output/UnderwaterCausticsCoral-prores.mov --codec prores --prores-profile hq

      - name: Render UnderwaterCausticsKelp (ProRes)
        run: npx remotion render src/index.tsx UnderwaterCausticsKelp output/UnderwaterCausticsKelp-prores.mov --codec prores --prores-profile hq

      - name: Render UnderwaterCausticsAbyss (ProRes)
        run: npx remotion render src/index.tsx UnderwaterCausticsAbyss output/UnderwaterCausticsAbyss-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode UnderwaterCaustics to MP4
        run: ffmpeg -y -i output/UnderwaterCaustics-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/UnderwaterCaustics.mp4

      - name: Encode UnderwaterCausticsDeepOcean to MP4
        run: ffmpeg -y -i output/UnderwaterCausticsDeepOcean-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/UnderwaterCausticsDeepOcean.mp4

      - name: Encode UnderwaterCausticsCoral to MP4
        run: ffmpeg -y -i output/UnderwaterCausticsCoral-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/UnderwaterCausticsCoral.mp4

      - name: Encode UnderwaterCausticsKelp to MP4
        run: ffmpeg -y -i output/UnderwaterCausticsKelp-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/UnderwaterCausticsKelp.mp4

      - name: Encode UnderwaterCausticsAbyss to MP4
        run: ffmpeg -y -i output/UnderwaterCausticsAbyss-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/UnderwaterCausticsAbyss.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload UnderwaterCaustics
        uses: actions/upload-artifact@v4
        with:
          name: UnderwaterCaustics-4K
          path: output/UnderwaterCaustics.mp4

      - name: Upload UnderwaterCausticsDeepOcean
        uses: actions/upload-artifact@v4
        with:
          name: UnderwaterCausticsDeepOcean-4K
          path: output/UnderwaterCausticsDeepOcean.mp4

      - name: Upload UnderwaterCausticsCoral
        uses: actions/upload-artifact@v4
        with:
          name: UnderwaterCausticsCoral-4K
          path: output/UnderwaterCausticsCoral.mp4

      - name: Upload UnderwaterCausticsKelp
        uses: actions/upload-artifact@v4
        with:
          name: UnderwaterCausticsKelp-4K
          path: output/UnderwaterCausticsKelp.mp4

      - name: Upload UnderwaterCausticsAbyss
        uses: actions/upload-artifact@v4
        with:
          name: UnderwaterCausticsAbyss-4K
          path: output/UnderwaterCausticsAbyss.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: UnderwaterCaustics-ProRes
          path: |
            output/UnderwaterCaustics-prores.mov
            output/UnderwaterCausticsDeepOcean-prores.mov
            output/UnderwaterCausticsCoral-prores.mov
            output/UnderwaterCausticsKelp-prores.mov
            output/UnderwaterCausticsAbyss-prores.mov

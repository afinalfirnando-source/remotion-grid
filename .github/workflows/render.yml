name: Render Inferno (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render Inferno (ProRes)
        run: npx remotion render src/index.tsx Inferno output/Inferno-prores.mov --codec prores --prores-profile hq

      - name: Render InfernoBlueFire (ProRes)
        run: npx remotion render src/index.tsx InfernoBlueFire output/InfernoBlueFire-prores.mov --codec prores --prores-profile hq

      - name: Render InfernoToxic (ProRes)
        run: npx remotion render src/index.tsx InfernoToxic output/InfernoToxic-prores.mov --codec prores --prores-profile hq

      - name: Render InfernoVoid (ProRes)
        run: npx remotion render src/index.tsx InfernoVoid output/InfernoVoid-prores.mov --codec prores --prores-profile hq

      - name: Render InfernoSolar (ProRes)
        run: npx remotion render src/index.tsx InfernoSolar output/InfernoSolar-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode Inferno to MP4
        run: ffmpeg -y -i output/Inferno-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/Inferno.mp4

      - name: Encode InfernoBlueFire to MP4
        run: ffmpeg -y -i output/InfernoBlueFire-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/InfernoBlueFire.mp4

      - name: Encode InfernoToxic to MP4
        run: ffmpeg -y -i output/InfernoToxic-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/InfernoToxic.mp4

      - name: Encode InfernoVoid to MP4
        run: ffmpeg -y -i output/InfernoVoid-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/InfernoVoid.mp4

      - name: Encode InfernoSolar to MP4
        run: ffmpeg -y -i output/InfernoSolar-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/InfernoSolar.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload Inferno
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-4K
          path: output/Inferno.mp4

      - name: Upload InfernoBlueFire
        uses: actions/upload-artifact@v4
        with:
          name: InfernoBlueFire-4K
          path: output/InfernoBlueFire.mp4

      - name: Upload InfernoToxic
        uses: actions/upload-artifact@v4
        with:
          name: InfernoToxic-4K
          path: output/InfernoToxic.mp4

      - name: Upload InfernoVoid
        uses: actions/upload-artifact@v4
        with:
          name: InfernoVoid-4K
          path: output/InfernoVoid.mp4

      - name: Upload InfernoSolar
        uses: actions/upload-artifact@v4
        with:
          name: InfernoSolar-4K
          path: output/InfernoSolar.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-ProRes
          path: |
            output/Inferno-prores.mov
            output/InfernoBlueFire-prores.mov
            output/InfernoToxic-prores.mov
            output/InfernoVoid-prores.mov
            output/InfernoSolar-prores.mov

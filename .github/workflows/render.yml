name: Render RetroWaves (3 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render RetroWaves Classic (ProRes)
        run: npx remotion render src/index.tsx RetroWaves output/RetroWaves-prores.mov --codec prores --prores-profile hq

      - name: Render RetroWaves Candy (ProRes)
        run: npx remotion render src/index.tsx RetroWavesCandy output/RetroWavesCandy-prores.mov --codec prores --prores-profile hq

      - name: Render RetroWaves Miami (ProRes)
        run: npx remotion render src/index.tsx RetroWavesMiami output/RetroWavesMiami-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode RetroWaves Classic to MP4
        run: ffmpeg -y -i output/RetroWaves-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RetroWaves.mp4

      - name: Encode RetroWaves Candy to MP4
        run: ffmpeg -y -i output/RetroWavesCandy-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RetroWavesCandy.mp4

      - name: Encode RetroWaves Miami to MP4
        run: ffmpeg -y -i output/RetroWavesMiami-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/RetroWavesMiami.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload RetroWaves Classic
        uses: actions/upload-artifact@v4
        with:
          name: RetroWaves-Classic-4K
          path: output/RetroWaves.mp4

      - name: Upload RetroWaves Candy
        uses: actions/upload-artifact@v4
        with:
          name: RetroWaves-Candy-4K
          path: output/RetroWavesCandy.mp4

      - name: Upload RetroWaves Miami
        uses: actions/upload-artifact@v4
        with:
          name: RetroWaves-Miami-4K
          path: output/RetroWavesMiami.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: RetroWaves-ProRes
          path: |
            output/RetroWaves-prores.mov
            output/RetroWavesCandy-prores.mov
            output/RetroWavesMiami-prores.mov

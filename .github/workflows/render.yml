name: Render MarbleFlow (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render MarbleFlow (ProRes)
        run: npx remotion render src/index.tsx MarbleFlow output/MarbleFlow-prores.mov --codec prores --prores-profile hq

      - name: Render MarbleFlowNoir (ProRes)
        run: npx remotion render src/index.tsx MarbleFlowNoir output/MarbleFlowNoir-prores.mov --codec prores --prores-profile hq

      - name: Render MarbleFlowRosa (ProRes)
        run: npx remotion render src/index.tsx MarbleFlowRosa output/MarbleFlowRosa-prores.mov --codec prores --prores-profile hq

      - name: Render MarbleFlowVerde (ProRes)
        run: npx remotion render src/index.tsx MarbleFlowVerde output/MarbleFlowVerde-prores.mov --codec prores --prores-profile hq

      - name: Render MarbleFlowRoyal (ProRes)
        run: npx remotion render src/index.tsx MarbleFlowRoyal output/MarbleFlowRoyal-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode MarbleFlow to MP4
        run: ffmpeg -y -i output/MarbleFlow-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MarbleFlow.mp4

      - name: Encode MarbleFlowNoir to MP4
        run: ffmpeg -y -i output/MarbleFlowNoir-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MarbleFlowNoir.mp4

      - name: Encode MarbleFlowRosa to MP4
        run: ffmpeg -y -i output/MarbleFlowRosa-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MarbleFlowRosa.mp4

      - name: Encode MarbleFlowVerde to MP4
        run: ffmpeg -y -i output/MarbleFlowVerde-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MarbleFlowVerde.mp4

      - name: Encode MarbleFlowRoyal to MP4
        run: ffmpeg -y -i output/MarbleFlowRoyal-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MarbleFlowRoyal.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload MarbleFlow
        uses: actions/upload-artifact@v4
        with:
          name: MarbleFlow-4K
          path: output/MarbleFlow.mp4

      - name: Upload MarbleFlowNoir
        uses: actions/upload-artifact@v4
        with:
          name: MarbleFlowNoir-4K
          path: output/MarbleFlowNoir.mp4

      - name: Upload MarbleFlowRosa
        uses: actions/upload-artifact@v4
        with:
          name: MarbleFlowRosa-4K
          path: output/MarbleFlowRosa.mp4

      - name: Upload MarbleFlowVerde
        uses: actions/upload-artifact@v4
        with:
          name: MarbleFlowVerde-4K
          path: output/MarbleFlowVerde.mp4

      - name: Upload MarbleFlowRoyal
        uses: actions/upload-artifact@v4
        with:
          name: MarbleFlowRoyal-4K
          path: output/MarbleFlowRoyal.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: MarbleFlow-ProRes
          path: |
            output/MarbleFlow-prores.mov
            output/MarbleFlowNoir-prores.mov
            output/MarbleFlowRosa-prores.mov
            output/MarbleFlowVerde-prores.mov
            output/MarbleFlowRoyal-prores.mov

name: Render PoolRipples (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PoolRipples (ProRes)
        run: npx remotion render src/index.tsx PoolRipples output/PoolRipples-prores.mov --codec prores --prores-profile hq

      - name: Render PoolRipplesLagoon (ProRes)
        run: npx remotion render src/index.tsx PoolRipplesLagoon output/PoolRipplesLagoon-prores.mov --codec prores --prores-profile hq

      - name: Render PoolRipplesSunset (ProRes)
        run: npx remotion render src/index.tsx PoolRipplesSunset output/PoolRipplesSunset-prores.mov --codec prores --prores-profile hq

      - name: Render PoolRipplesMidnight (ProRes)
        run: npx remotion render src/index.tsx PoolRipplesMidnight output/PoolRipplesMidnight-prores.mov --codec prores --prores-profile hq

      - name: Render PoolRipplesEmerald (ProRes)
        run: npx remotion render src/index.tsx PoolRipplesEmerald output/PoolRipplesEmerald-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode PoolRipples to MP4
        run: ffmpeg -y -i output/PoolRipples-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PoolRipples.mp4

      - name: Encode PoolRipplesLagoon to MP4
        run: ffmpeg -y -i output/PoolRipplesLagoon-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PoolRipplesLagoon.mp4

      - name: Encode PoolRipplesSunset to MP4
        run: ffmpeg -y -i output/PoolRipplesSunset-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PoolRipplesSunset.mp4

      - name: Encode PoolRipplesMidnight to MP4
        run: ffmpeg -y -i output/PoolRipplesMidnight-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PoolRipplesMidnight.mp4

      - name: Encode PoolRipplesEmerald to MP4
        run: ffmpeg -y -i output/PoolRipplesEmerald-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PoolRipplesEmerald.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload PoolRipples
        uses: actions/upload-artifact@v4
        with:
          name: PoolRipples-4K
          path: output/PoolRipples.mp4

      - name: Upload PoolRipplesLagoon
        uses: actions/upload-artifact@v4
        with:
          name: PoolRipplesLagoon-4K
          path: output/PoolRipplesLagoon.mp4

      - name: Upload PoolRipplesSunset
        uses: actions/upload-artifact@v4
        with:
          name: PoolRipplesSunset-4K
          path: output/PoolRipplesSunset.mp4

      - name: Upload PoolRipplesMidnight
        uses: actions/upload-artifact@v4
        with:
          name: PoolRipplesMidnight-4K
          path: output/PoolRipplesMidnight.mp4

      - name: Upload PoolRipplesEmerald
        uses: actions/upload-artifact@v4
        with:
          name: PoolRipplesEmerald-4K
          path: output/PoolRipplesEmerald.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: PoolRipples-ProRes
          path: |
            output/PoolRipples-prores.mov
            output/PoolRipplesLagoon-prores.mov
            output/PoolRipplesSunset-prores.mov
            output/PoolRipplesMidnight-prores.mov
            output/PoolRipplesEmerald-prores.mov

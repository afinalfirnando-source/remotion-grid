name: Render PlushFur (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PlushFur (ProRes)
        run: npx remotion render src/index.tsx PlushFur output/PlushFur-prores.mov --codec prores --prores-profile hq

      - name: Render PlushFurCream (ProRes)
        run: npx remotion render src/index.tsx PlushFurCream output/PlushFurCream-prores.mov --codec prores --prores-profile hq

      - name: Render PlushFurLavender (ProRes)
        run: npx remotion render src/index.tsx PlushFurLavender output/PlushFurLavender-prores.mov --codec prores --prores-profile hq

      - name: Render PlushFurMint (ProRes)
        run: npx remotion render src/index.tsx PlushFurMint output/PlushFurMint-prores.mov --codec prores --prores-profile hq

      - name: Render PlushFurSky (ProRes)
        run: npx remotion render src/index.tsx PlushFurSky output/PlushFurSky-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode PlushFur to MP4
        run: ffmpeg -y -i output/PlushFur-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlushFur.mp4

      - name: Encode PlushFurCream to MP4
        run: ffmpeg -y -i output/PlushFurCream-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlushFurCream.mp4

      - name: Encode PlushFurLavender to MP4
        run: ffmpeg -y -i output/PlushFurLavender-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlushFurLavender.mp4

      - name: Encode PlushFurMint to MP4
        run: ffmpeg -y -i output/PlushFurMint-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlushFurMint.mp4

      - name: Encode PlushFurSky to MP4
        run: ffmpeg -y -i output/PlushFurSky-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlushFurSky.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload PlushFur
        uses: actions/upload-artifact@v4
        with:
          name: PlushFur-4K
          path: output/PlushFur.mp4

      - name: Upload PlushFurCream
        uses: actions/upload-artifact@v4
        with:
          name: PlushFurCream-4K
          path: output/PlushFurCream.mp4

      - name: Upload PlushFurLavender
        uses: actions/upload-artifact@v4
        with:
          name: PlushFurLavender-4K
          path: output/PlushFurLavender.mp4

      - name: Upload PlushFurMint
        uses: actions/upload-artifact@v4
        with:
          name: PlushFurMint-4K
          path: output/PlushFurMint.mp4

      - name: Upload PlushFurSky
        uses: actions/upload-artifact@v4
        with:
          name: PlushFurSky-4K
          path: output/PlushFurSky.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: PlushFur-ProRes
          path: |
            output/PlushFur-prores.mov
            output/PlushFurCream-prores.mov
            output/PlushFurLavender-prores.mov
            output/PlushFurMint-prores.mov
            output/PlushFurSky-prores.mov

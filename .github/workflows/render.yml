name: Render BreathingMesh (3 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render BreathingMeshBlue (ProRes)
        run: npx remotion render src/index.tsx BreathingMeshBlue output/BreathingMeshBlue-prores.mov --codec prores --prores-profile hq

      - name: Render BreathingMeshSteel (ProRes)
        run: npx remotion render src/index.tsx BreathingMeshSteel output/BreathingMeshSteel-prores.mov --codec prores --prores-profile hq

      - name: Render BreathingMeshDeepSea (ProRes)
        run: npx remotion render src/index.tsx BreathingMeshDeepSea output/BreathingMeshDeepSea-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode BreathingMeshBlue to MP4
        run: ffmpeg -y -i output/BreathingMeshBlue-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BreathingMeshBlue.mp4

      - name: Encode BreathingMeshSteel to MP4
        run: ffmpeg -y -i output/BreathingMeshSteel-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BreathingMeshSteel.mp4

      - name: Encode BreathingMeshDeepSea to MP4
        run: ffmpeg -y -i output/BreathingMeshDeepSea-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/BreathingMeshDeepSea.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload BreathingMeshBlue
        uses: actions/upload-artifact@v4
        with:
          name: BreathingMeshBlue-4K
          path: output/BreathingMeshBlue.mp4

      - name: Upload BreathingMeshSteel
        uses: actions/upload-artifact@v4
        with:
          name: BreathingMeshSteel-4K
          path: output/BreathingMeshSteel.mp4

      - name: Upload BreathingMeshDeepSea
        uses: actions/upload-artifact@v4
        with:
          name: BreathingMeshDeepSea-4K
          path: output/BreathingMeshDeepSea.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: BreathingMesh-ProRes
          path: |
            output/BreathingMeshBlue-prores.mov
            output/BreathingMeshSteel-prores.mov
            output/BreathingMeshDeepSea-prores.mov

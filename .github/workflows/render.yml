name: Render NeonTubes (3 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render NeonTubes (ProRes)
        run: npx remotion render src/index.tsx NeonTubes output/NeonTubes-prores.mov --codec prores --prores-profile hq

      - name: Render PurpleTubes (ProRes)
        run: npx remotion render src/index.tsx PurpleTubes output/PurpleTubes-prores.mov --codec prores --prores-profile hq

      - name: Render MagmaTubes (ProRes)
        run: npx remotion render src/index.tsx MagmaTubes output/MagmaTubes-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode NeonTubes to MP4
        run: ffmpeg -y -i output/NeonTubes-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/NeonTubes.mp4

      - name: Encode PurpleTubes to MP4
        run: ffmpeg -y -i output/PurpleTubes-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PurpleTubes.mp4

      - name: Encode MagmaTubes to MP4
        run: ffmpeg -y -i output/MagmaTubes-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MagmaTubes.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload NeonTubes
        uses: actions/upload-artifact@v4
        with:
          name: NeonTubes-4K
          path: output/NeonTubes.mp4

      - name: Upload PurpleTubes
        uses: actions/upload-artifact@v4
        with:
          name: PurpleTubes-4K
          path: output/PurpleTubes.mp4

      - name: Upload MagmaTubes
        uses: actions/upload-artifact@v4
        with:
          name: MagmaTubes-4K
          path: output/MagmaTubes.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: NeonTubes-ProRes
          path: |
            output/NeonTubes-prores.mov
            output/PurpleTubes-prores.mov
            output/MagmaTubes-prores.mov

name: Render Grid backgrounds

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render GridWave (ProRes)
        run: npx remotion render src/index.tsx GridWave output/GridWave-prores.mov --codec prores --prores-profile hq

      - name: Render GridWaveNeon (ProRes)
        run: npx remotion render src/index.tsx GridWaveNeon output/GridWaveNeon-prores.mov --codec prores --prores-profile hq

      - name: Render SphereRipple Ocean (ProRes)
        run: npx remotion render src/index.tsx SphereRipple output/SphereRipple-prores.mov --codec prores --prores-profile hq

      - name: Render NeonPurpleSphere (ProRes)
        run: npx remotion render src/index.tsx NeonPurpleSphere output/NeonPurpleSphere-prores.mov --codec prores --prores-profile hq

      - name: Render SunsetGoldSphere (ProRes)
        run: npx remotion render src/index.tsx SunsetGoldSphere output/SunsetGoldSphere-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode GridWave to MP4
        run: ffmpeg -y -i output/GridWave-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/GridWave.mp4

      - name: Encode GridWaveNeon to MP4
        run: ffmpeg -y -i output/GridWaveNeon-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/GridWaveNeon.mp4

      - name: Encode SphereRipple Ocean to MP4
        run: ffmpeg -y -i output/SphereRipple-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SphereRipple.mp4

      - name: Encode NeonPurpleSphere to MP4
        run: ffmpeg -y -i output/NeonPurpleSphere-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/NeonPurpleSphere.mp4

      - name: Encode SunsetGoldSphere to MP4
        run: ffmpeg -y -i output/SunsetGoldSphere-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/SunsetGoldSphere.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload GridWave
        uses: actions/upload-artifact@v4
        with:
          name: GridWave-4K
          path: output/GridWave.mp4

      - name: Upload GridWaveNeon
        uses: actions/upload-artifact@v4
        with:
          name: GridWaveNeon-4K
          path: output/GridWaveNeon.mp4

      - name: Upload SphereRipple Ocean
        uses: actions/upload-artifact@v4
        with:
          name: SphereRipple-Ocean-4K
          path: output/SphereRipple.mp4

      - name: Upload NeonPurpleSphere
        uses: actions/upload-artifact@v4
        with:
          name: NeonPurpleSphere-4K
          path: output/NeonPurpleSphere.mp4

      - name: Upload SunsetGoldSphere
        uses: actions/upload-artifact@v4
        with:
          name: SunsetGoldSphere-4K
          path: output/SunsetGoldSphere.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: ProRes-Masters
          path: output/*.mov

name: Render 6 Cubes Videos

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PurpleCubes (ProRes)
        run: npx remotion render src/index.tsx PurpleCubes output/PurpleCubes-prores.mov --codec prores --prores-profile hq

      - name: Render NeonCubes (ProRes)
        run: npx remotion render src/index.tsx NeonCubes output/NeonCubes-prores.mov --codec prores --prores-profile hq

      - name: Render MagmaCubes (ProRes)
        run: npx remotion render src/index.tsx MagmaCubes output/MagmaCubes-prores.mov --codec prores --prores-profile hq

      - name: Render EmeraldHex (ProRes)
        run: npx remotion render src/index.tsx EmeraldHex output/EmeraldHex-prores.mov --codec prores --prores-profile hq

      - name: Render OceanHex (ProRes)
        run: npx remotion render src/index.tsx OceanHex output/OceanHex-prores.mov --codec prores --prores-profile hq

      - name: Render LavaHex (ProRes)
        run: npx remotion render src/index.tsx LavaHex output/LavaHex-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode PurpleCubes to MP4
        run: ffmpeg -y -i output/PurpleCubes-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PurpleCubes.mp4

      - name: Encode NeonCubes to MP4
        run: ffmpeg -y -i output/NeonCubes-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/NeonCubes.mp4

      - name: Encode MagmaCubes to MP4
        run: ffmpeg -y -i output/MagmaCubes-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/MagmaCubes.mp4

      - name: Encode EmeraldHex to MP4
        run: ffmpeg -y -i output/EmeraldHex-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/EmeraldHex.mp4

      - name: Encode OceanHex to MP4
        run: ffmpeg -y -i output/OceanHex-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/OceanHex.mp4

      - name: Encode LavaHex to MP4
        run: ffmpeg -y -i output/LavaHex-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/LavaHex.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload PurpleCubes
        uses: actions/upload-artifact@v4
        with:
          name: PurpleCubes-4K
          path: output/PurpleCubes.mp4

      - name: Upload NeonCubes
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubes-4K
          path: output/NeonCubes.mp4

      - name: Upload MagmaCubes
        uses: actions/upload-artifact@v4
        with:
          name: MagmaCubes-4K
          path: output/MagmaCubes.mp4

      - name: Upload EmeraldHex
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldHex-4K
          path: output/EmeraldHex.mp4

      - name: Upload OceanHex
        uses: actions/upload-artifact@v4
        with:
          name: OceanHex-4K
          path: output/OceanHex.mp4

      - name: Upload LavaHex
        uses: actions/upload-artifact@v4
        with:
          name: LavaHex-4K
          path: output/LavaHex.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: Cubes-ProRes
          path: |
            output/PurpleCubes-prores.mov
            output/NeonCubes-prores.mov
            output/MagmaCubes-prores.mov
            output/EmeraldHex-prores.mov
            output/OceanHex-prores.mov
            output/LavaHex-prores.mov

name: Render PlasmaVortex (5 colors)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render PlasmaVortex (ProRes)
        run: npx remotion render src/index.tsx PlasmaVortex output/PlasmaVortex-prores.mov --codec prores --prores-profile hq

      - name: Render PlasmaVortexCrimson (ProRes)
        run: npx remotion render src/index.tsx PlasmaVortexCrimson output/PlasmaVortexCrimson-prores.mov --codec prores --prores-profile hq

      - name: Render PlasmaVortexAbyss (ProRes)
        run: npx remotion render src/index.tsx PlasmaVortexAbyss output/PlasmaVortexAbyss-prores.mov --codec prores --prores-profile hq

      - name: Render PlasmaVortexInferno (ProRes)
        run: npx remotion render src/index.tsx PlasmaVortexInferno output/PlasmaVortexInferno-prores.mov --codec prores --prores-profile hq

      - name: Render PlasmaVortexVenom (ProRes)
        run: npx remotion render src/index.tsx PlasmaVortexVenom output/PlasmaVortexVenom-prores.mov --codec prores --prores-profile hq

      - name: Check ProRes sizes
        run: ls -lh output/*.mov

      - name: Encode PlasmaVortex to MP4
        run: ffmpeg -y -i output/PlasmaVortex-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlasmaVortex.mp4

      - name: Encode PlasmaVortexCrimson to MP4
        run: ffmpeg -y -i output/PlasmaVortexCrimson-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlasmaVortexCrimson.mp4

      - name: Encode PlasmaVortexAbyss to MP4
        run: ffmpeg -y -i output/PlasmaVortexAbyss-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlasmaVortexAbyss.mp4

      - name: Encode PlasmaVortexInferno to MP4
        run: ffmpeg -y -i output/PlasmaVortexInferno-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlasmaVortexInferno.mp4

      - name: Encode PlasmaVortexVenom to MP4
        run: ffmpeg -y -i output/PlasmaVortexVenom-prores.mov -vf "noise=alls=8:allf=t" -c:v libx264 -preset slow -b:v 100M -maxrate 130M -bufsize 200M -pix_fmt yuv420p output/PlasmaVortexVenom.mp4

      - name: Check final file sizes
        run: ls -lh output/*.mp4

      - name: Upload PlasmaVortex
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaVortex-4K
          path: output/PlasmaVortex.mp4

      - name: Upload PlasmaVortexCrimson
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaVortexCrimson-4K
          path: output/PlasmaVortexCrimson.mp4

      - name: Upload PlasmaVortexAbyss
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaVortexAbyss-4K
          path: output/PlasmaVortexAbyss.mp4

      - name: Upload PlasmaVortexInferno
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaVortexInferno-4K
          path: output/PlasmaVortexInferno.mp4

      - name: Upload PlasmaVortexVenom
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaVortexVenom-4K
          path: output/PlasmaVortexVenom.mp4

      - name: Upload ProRes masters
        uses: actions/upload-artifact@v4
        with:
          name: PlasmaVortex-ProRes
          path: |
            output/PlasmaVortex-prores.mov
            output/PlasmaVortexCrimson-prores.mov
            output/PlasmaVortexAbyss-prores.mov
            output/PlasmaVortexInferno-prores.mov
            output/PlasmaVortexVenom-prores.mov
